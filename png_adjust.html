<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG ADJUST</title>
    <link rel="stylesheet" href="/png_adjust.css">
</head>
<body>
    <div>
        <h1>PNG ADJUST</h1>
        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            <input type="text" name="new_name" id="new_name"><br>  <!--the bug is because there isn't any 'label', but it's chill-->
            <input type="file" name="images" id="images" multiple accept=".png"><br>
            <input type="submit" value="BOOOM">
        </form>
        <div id="messages">
            <!-- Messages will be dynamically inserted here -->
        </div>
        <h6>(Only PNG images with transparency accepted)</h6>
    </div>
    <script>
        // Handle form submission and display messages dynamically
        const form = document.getElementById('uploadForm');
        const messagesDiv = document.getElementById('messages');

        form.addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent default form submission

            const formData = new FormData(form);

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.text();
                messagesDiv.innerHTML = `<p>${result}</p>`;
            } catch (error) {
                messagesDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
