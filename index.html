<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose Your Components</title>
</head>
<body>
    <h1>Choose Your Components</h1>
    <form id="form-components">
        <fieldset>
            <legend>Components</legend>
            <label><input type="checkbox" name="case" value="2227"> case</label><br>
            <label><input type="checkbox" name="gpu" value="260"> gpu</label><br>
            <label><input type="checkbox" name="motherboard" value="617"> mobo</label><br>
            <label><input type="checkbox" name="aio" value="69"> AIO</label><br>
            <label><input type="checkbox" name="fans" value="1002"> Fan</label><br>
            <label><input type="checkbox" name="aircooler" value="1729"> Aircooler</label><br>
        </fieldset>

            <label><input type="checkbox" id="vertical-gpu"> Vertical GPU</label>

        <h2>✅ Selected Components</h2>
            <ul id="selected-components-list"></ul>
        <button type="button" id="reset-button">Reset</button>
     </form>

    <canvas id="configCanvas" width="800" height="600"></canvas>

    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="/index.css">
</body>
</html>
