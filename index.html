<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Choisissez vos composants</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Choisissez vos composants :</h1>
    <form id="form-composants">
        <select name="cpu" id="cpu">
            <option value="">Processeur</option>
            <option value="intel-core-i5">Intel Core i5</option>
            <option value="amd-ryzen-7">AMD Ryzen 7</option>
            <option value="intel-core-i9">Intel Core i9</option>
        </select>

        <select name="gpu" id="gpu">
            <option value="">Carte Graphique</option>
            <option value="nvidia-gtx-1660-ti">NVIDIA GeForce GTX 1660 Ti</option>
            <option value="amd-rx-5600-xt">AMD Radeon RX 5600 XT</option>
            <option value="intel-iris-xe">Intel Iris Xe Graphics</option>
        </select>

        <select name="ram" id="ram" multiple>
            <option value="">RAM</option>
            <option value="8go">8 Go</option>
            <option value="16go">16 Go</option>
            <option value="32go">32 Go</option>
        </select>

        <select name="storage" id="storage">
            <option value="">Stockage</option>
            <option value="1to-ssd">1 To SSD</option>
            <option value="2to-hdd">2 To HDD</option>
            <option value="4to-nvme">4 To NVMe</option>
        </select>

        <select name="motherboard" id="motherboard"></select>
            <option value="">Carte Mère</option>
            <option value="1to-ssd">1 To SSD</option>
            <option value="2to-hdd">2 To HDD</option>
            <option value="4to-nvme">4 To NVMe</option>
        </select>

        <select name="case" id="case"></select>
            <option value="">Boitier</option>
            <option value="1to-ssd">1 To SSD</option>
            <option value="2to-hdd">2 To HDD</option>
            <option value="4to-nvme">4 To NVMe</option>
        </select>

        <select name="cooler" id="cooler"></select>
            <option value="">Refroidissement Processeur</option>
            <option value="1to-ssd">1 To SSD</option>
            <option value="2to-hdd">2 To HDD</option>
            <option value="4to-nvme">4 To NVMe</option>
        </select>

        <select name="fans" id="fans"></select>
            <option value="">Ventilateurs</option>
            <option value="1to-ssd">1 To SSD</option>
            <option value="2to-hdd">2 To HDD</option>
            <option value="4to-nvme">4 To NVMe</option>
        </select>

        <button type="button" id="submit-btn">Valider mes choix</button>
    </form>
    
    <canvas id="configCanvas" width="800" height="600"></canvas>

    <script src="script.js"></script>
</body>
</html>
